name: Godot Smoke Test

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Run headless smoke test
        run: godot --headless --path . --script res://tests/smoke_test.gd
